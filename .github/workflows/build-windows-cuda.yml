name: Build Windows CUDA (no NCCL)

# Builds the CUDA-enabled LightGBM CLI + Python wheel for Windows and
# publishes them as prebuilt release assets on v* tags.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # GPU architectures baked into the binaries:
  # 75=Turing, 80=Ampere, 86=Ampere(laptop)/RTX30, 89=Ada(RTX40), 120=Blackwell(RTX50)
  CUDAARCHS: "75;80;86;89;120"

jobs:
  build-windows-cuda:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cuda_version: ['13.3.0']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA Toolkit ${{ matrix.cuda_version }}
        id: cudatoolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda_version }}
          method: local
          use-github-cache: true

      - name: Show toolchain versions
        shell: cmd
        run: |
          nvcc --version
          cmake --version
          ninja --version

      - name: Build CLI (lightgbm.exe + lib_lightgbm.dll)
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DUSE_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES="${{ env.CUDAARCHS }}" ^
            -DCMAKE_CUDA_COMPILER="%CUDA_PATH%\bin\nvcc.exe"
          cmake --build build -j
          dir build

      - name: Build Python wheel
        shell: bash
        env:
          CMAKE_GENERATOR: Ninja
          CUDACXX: ${{ steps.cudatoolkit.outputs.CUDA_PATH }}\bin\nvcc.exe
        run: |
          python -m pip install --upgrade pip build scikit-build-core ninja
          sh build-python.sh bdist_wheel --cuda --no-isolation
          ls dist/

      - name: Smoke test wheel (CPU training on GPU-less runner)
        shell: bash
        run: |
          python -m pip install dist/lightgbm*.whl
          python - <<'PY'
          import numpy as np, lightgbm as lgb
          print("lightgbm", lgb.__version__)
          rng = np.random.RandomState(0)
          X = rng.randn(2000, 10).astype(np.float32)
          y = (X[:, 0] > 0).astype(np.int32)
          bst = lgb.train({"objective": "binary", "num_leaves": 15, "verbose": -1},
                          lgb.Dataset(X, label=y), num_boost_round=10)
          assert bst.predict(X[:10]).shape == (10,)
          print("SMOKE_OK")
          PY

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets
          # Ninja build places outputs at the repo root (RUNTIME_OUTPUT_DIRECTORY)
          if (Test-Path lib_lightgbm.dll) { Copy-Item lib_lightgbm.dll release_assets\ }
          if (Test-Path lightgbm.exe)   { Copy-Item lightgbm.exe release_assets\ }
          if (Test-Path build\lib_lightgbm.dll) { Copy-Item build\lib_lightgbm.dll release_assets\ }
          if (Test-Path build\lightgbm.exe)     { Copy-Item build\lightgbm.exe release_assets\ }
          Copy-Item dist/*.whl release_assets/
          Get-ChildItem release_assets

      - uses: actions/upload-artifact@v4
        with:
          name: windows-cuda-${{ matrix.cuda_version }}
          path: release_assets/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/lib_lightgbm.dll
            release_assets/lightgbm.exe
            release_assets/*.whl
          body: |
            Prebuilt LightGBM Windows binaries with **CUDA support (single GPU, no NCCL)**.

            - CUDA Toolkit: ${{ matrix.cuda_version }}
            - GPU architectures: ${{ env.CUDAARCHS }}
            - Usage: `params['device'] = 'cuda'` (Python) or `device = cuda` (CLI config)

            The wheel is built with statically linked CUDA runtime — no CUDA
            Toolkit installation is needed to use it; only an NVIDIA driver
            new enough for CUDA ${{ matrix.cuda_version }}.
          generate_release_notes: true
