name: Build Windows CUDA (no NCCL)

# Builds two Windows variants and publishes them as prebuilt release assets on v* tags:
#   cuda        - CPU + CUDA
#   cuda-opencl - CPU + OpenCL + CUDA (all-in-one, switchable via device= param)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Consumer NVIDIA GPUs, Turing and newer: 75=GTX16/RTX20, 80/86=RTX30, 89=RTX40 (4090), 120=RTX50.
  # (Pascal/GTX 10-series was removed from the CUDA 13 toolchain; those users take the
  #  all-in-one variant and run device=gpu (OpenCL), which is architecture-agnostic.)
  CUDAARCHS: "75;80;86;89;120"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
          - variant: cuda-opencl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA Toolkit 13.3
        id: cudatoolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.0'
          method: local
          use-github-cache: true

      - name: Cache Boost 1.85 (b2 static /MD)
        if: matrix.variant == 'cuda-opencl'
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: boost_1_85_0
          key: boost-1.85.0-b2-msvc145-static-md-v2

      - name: Download & build Boost 1.85
        if: matrix.variant == 'cuda-opencl' && steps.cache-boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          rem Boost 1.85 matches the locally verified toolchain; newer Boost (1.89+,
          rem e.g. vcpkg 1.92) changed boost::uuids sha1's get_digest signature, which
          rem breaks LightGBM's bundled Boost.Compute headers.
          curl -fsSL -o boost.tar.gz https://archives.boost.io/release/1.85.0/source/boost_1_85_0.tar.gz
          tar -xzf boost.tar.gz
          cd boost_1_85_0
          call bootstrap.bat msvc
          rem b2 1.85 does not know VS2026's toolset (falls back to msvc-6.0);
          rem declare it explicitly and reuse the MSVC env activated earlier
          (echo using msvc : 14.5 : "cl" ;)>user-config.jam
          b2 -q -j%NUMBER_OF_PROCESSORS% toolset=msvc-14.5 --user-config=user-config.jam --with-filesystem --with-system link=static runtime-link=shared variant=release threading=multi address-model=64 stage

      - name: Build CLI
        shell: bash
        run: |
          BOOST_ARGS=()
          if [ "${{ matrix.variant }}" = "cuda-opencl" ]; then
            BOOST_ARGS=(-DUSE_GPU=ON
              -DBOOST_ROOT="$GITHUB_WORKSPACE/boost_1_85_0"
              -DBoost_DIR="$GITHUB_WORKSPACE/boost_1_85_0/stage/lib/cmake/Boost-1.85.0"
              -DOpenCL_INCLUDE_DIR="$CUDA_PATH/include"
              -DOpenCL_LIBRARY="$CUDA_PATH/lib/x64/OpenCL.lib")
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="${CUDAARCHS}" \
            -DCMAKE_CUDA_COMPILER="$CUDA_PATH/bin/nvcc.exe" \
            "${BOOST_ARGS[@]}"
          cmake --build build -j
          # stash binaries immediately: build-python.sh later runs
          # "rm -rf ./lightgbm" which (via Git Bash) also deletes lightgbm.exe
          mkdir -p release_assets
          if [ "${{ matrix.variant }}" = "cuda-opencl" ]; then
            cp lightgbm.exe release_assets/all-lightgbm.exe
            cp lib_lightgbm.dll release_assets/all-lib_lightgbm.dll
          else
            cp lightgbm.exe lib_lightgbm.dll release_assets/
          fi
          ls -la release_assets

      - name: Build Python wheel
        shell: bash
        env:
          CMAKE_GENERATOR: Ninja
          CUDACXX: ${{ steps.cudatoolkit.outputs.CUDA_PATH }}\bin\nvcc.exe
        run: |
          python -m pip install --upgrade pip build scikit-build-core ninja
          WHEEL_ARGS=()
          if [ "${{ matrix.variant }}" = "cuda-opencl" ]; then
            WHEEL_ARGS=(--gpu
              "--boost-root=$GITHUB_WORKSPACE/boost_1_85_0"
              "--boost-dir=$GITHUB_WORKSPACE/boost_1_85_0/stage/lib/cmake/Boost-1.85.0"
              "--opencl-include-dir=$CUDA_PATH/include"
              "--opencl-library=$CUDA_PATH/lib/x64/OpenCL.lib")
          fi
          sh build-python.sh bdist_wheel --cuda "${WHEEL_ARGS[@]}" --no-isolation
          ls dist/
          if [ "${{ matrix.variant }}" = "cuda-opencl" ]; then
            # local version segment so both variants can coexist on PyPI-less installs
            orig=$(ls dist/lightgbm-*.whl); ver=$(basename "$orig" .whl | cut -d- -f2)
            mv "$orig" "dist/lightgbm-${ver}+all-py3-none-win_amd64.whl"
          fi

      - name: Smoke test wheel
        shell: bash
        run: |
          python -m pip install dist/lightgbm*.whl
          python - <<'PY'
          import numpy as np, lightgbm as lgb
          print("lightgbm", lgb.__version__)
          rng = np.random.RandomState(0)
          X = rng.randn(2000, 10).astype(np.float32)
          y = (X[:, 0] > 0).astype(np.int32)
          bst = lgb.train({"objective": "binary", "num_leaves": 15, "verbose": -1},
                          lgb.Dataset(X, label=y), num_boost_round=10)
          assert bst.predict(X[:10]).shape == (10,)
          # GPU learners must be compiled in. On this GPU-less runner selecting
          # them fails at runtime; the error must NOT say "was not enabled".
          for dev in ("cuda", "gpu"):
              try:
                  lgb.train({"objective": "binary", "device": dev, "verbose": -1},
                            lgb.Dataset(X, label=y), num_boost_round=1)
                  print(f"[{dev}] trained (GPU present on runner)")
              except Exception as e:
                  msg = str(e)
                  assert "not enabled" not in msg, f"[{dev}] learner missing: {msg}"
                  print(f"[{dev}] learner compiled in; GPU-less runtime error: {msg.strip()[:80]}")
          print("SMOKE_OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.variant }}
          path: release_assets/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: rel

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rel/lightgbm.exe
            rel/lib_lightgbm.dll
            rel/all-lightgbm.exe
            rel/all-lib_lightgbm.dll
            rel/*.whl
          body: |
            Prebuilt LightGBM Windows binaries. **No NCCL** — all GPU code paths are single-GPU (`num_gpu=1`).

            ## Pick your variant

            | Files | Device options | Use when |
            |---|---|---|
            | `lightgbm.exe`, `lib_lightgbm.dll`, `lightgbm-*.py3-none-win_amd64.whl` | `cpu`, `cuda` | Standard NVIDIA GPU setup (recommended) |
            | `all-lightgbm.exe`, `all-lib_lightgbm.dll`, `lightgbm-*+all-*.whl` | `cpu`, `cuda`, `gpu` (OpenCL) | Also need the OpenCL GPU version (e.g. dense data on old GPUs; sparse features are CPU-fallback there) |

            - CUDA Toolkit 13.3, GPU architectures: ${{ env.CUDAARCHS }} (Turing → Blackwell)
            - CUDA runtime statically linked — no CUDA Toolkit install needed, just a recent NVIDIA driver
            - Usage: `device = cpu` / `cuda` / `gpu` in params.
              ⚠️ switch `device` on a fresh Dataset (reusing one Dataset across CPU→CUDA raises an upstream limitation).

            Wheels carry a local version tag: `+all` marks the CPU+OpenCL+CUDA variant.
          generate_release_notes: true
