name: Build Windows CUDA (no NCCL)

# Builds two Windows variants and publishes them as prebuilt release assets on v* tags:
#   cuda        - CPU + CUDA
#   cuda-opencl - CPU + OpenCL + CUDA (all-in-one, switchable via device= param)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Consumer NVIDIA GPUs, Turing and newer: 75=GTX16/RTX20, 80/86=RTX30, 89=RTX40 (4090), 120=RTX50.
  # (Pascal/GTX 10-series was removed from the CUDA 13 toolchain; those users take the
  #  all-in-one variant and run device=gpu (OpenCL), which is architecture-agnostic.)
  CUDAARCHS: "75;80;86;89;120"

jobs:
  # Gate for main-branch pushes: skip the heavy pipeline when only docs
  # changed. Tags / PRs / workflow_dispatch always build (job skipped there).
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect code changes
        id: filter
        shell: bash
        run: |
          # default to building when the diff cannot be determined
          code=true
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if ! git diff --name-only HEAD~1 HEAD | grep -qE '^(src/|include/|cmake/|external_libs/|python-package/|CMakeLists\.txt)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  # Primes the shared caches once per run: both build jobs then start warm.
  # Without this, a cold run installs CUDA twice (once per matrix job).
  prime:
    needs: changes
    if: >-
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: windows-latest
    steps:
      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore CUDA Toolkit cache
        id: prime-cuda
        uses: actions/cache/restore@v4
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3
          key: cuda-13.3.0-windows-x64-installed-v1

      - name: Install CUDA Toolkit 13.3
        if: steps.prime-cuda.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.0'
          method: local
          use-github-cache: false

      - name: Save CUDA Toolkit cache
        if: steps.prime-cuda.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3
          key: cuda-13.3.0-windows-x64-installed-v1
        continue-on-error: true

      - name: Restore Boost cache
        id: prime-boost
        uses: actions/cache/restore@v4
        with:
          path: boost_1_85_0
          key: boost-1.85.0-b2-msvc145-static-md-v5

      - name: Download & build Boost 1.85
        if: steps.prime-boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl -fsSL -o boost.tar.gz https://archives.boost.io/release/1.85.0/source/boost_1_85_0.tar.gz
          tar -xzf boost.tar.gz
          cd boost_1_85_0
          call bootstrap.bat msvc
          rem see the build job for why: b2 1.85 cannot auto-detect VS2026
          (echo using msvc : 14.5 : "%VCToolsInstallDir%bin\Hostx64\x64\cl.exe" : ^<setup^>"%VCINSTALLDIR%Auxiliary\Build\vcvarsall.bat" ;)>project-config.jam
          b2 -q -j%NUMBER_OF_PROCESSORS% toolset=msvc-14.5 --with-filesystem --with-system link=static runtime-link=shared variant=release threading=multi address-model=64 stage

      - name: Save Boost cache
        if: steps.prime-boost.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: boost_1_85_0
          key: boost-1.85.0-b2-msvc145-static-md-v5
        continue-on-error: true

  build:
    needs: [prime, changes]
    if: >-
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
          - variant: cuda-opencl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore CUDA Toolkit cache
        id: cache-cuda
        uses: actions/cache/restore@v4
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3
          key: cuda-13.3.0-windows-x64-installed-v1

      - name: Install CUDA Toolkit 13.3
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.0'
          method: local
          use-github-cache: false

      - name: Save CUDA Toolkit cache
        # save right after install: actions/cache's post-save is skipped when any
        # later step fails (post-if: success()), which is why the cache never
        # populated before
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3
          key: cuda-13.3.0-windows-x64-installed-v1
        continue-on-error: true

      - name: Set CUDA environment
        shell: pwsh
        run: |
          # works for both the fresh install and the cache-restored toolkit;
          # downstream steps use $CUDA_PATH/bin/nvcc.exe (absolute paths) and
          # scikit-build finds nvcc via PATH
          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3"
          if (-not (Test-Path "$cuda\bin\nvcc.exe")) { throw "nvcc not found at $cuda" }
          echo "CUDA_PATH=$cuda" >> $env:GITHUB_ENV
          echo "$cuda\bin" >> $env:GITHUB_PATH

      - name: Restore Boost cache
        if: matrix.variant == 'cuda-opencl'
        id: cache-boost
        uses: actions/cache/restore@v4
        with:
          path: boost_1_85_0
          key: boost-1.85.0-b2-msvc145-static-md-v5

      - name: Download & build Boost 1.85
        if: matrix.variant == 'cuda-opencl' && steps.cache-boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          rem Boost 1.85 matches the locally verified toolchain; newer Boost (1.89+,
          rem e.g. vcpkg 1.92) changed boost::uuids sha1's get_digest signature, which
          rem breaks LightGBM's bundled Boost.Compute headers.
          curl -fsSL -o boost.tar.gz https://archives.boost.io/release/1.85.0/source/boost_1_85_0.tar.gz
          tar -xzf boost.tar.gz
          cd boost_1_85_0
          call bootstrap.bat msvc
          rem b2 1.85 cannot auto-detect VS2026 (unknown toolset: setup target fails
          rem with "Did not find command for MSVC toolset"). Pin the absolute cl path
          rem and an explicit <setup> — both taken from the msvc-dev-cmd environment.
          rem Syntax verified locally against the same b2 1.85 + VS2026 combination.
          (echo using msvc : 14.5 : "%VCToolsInstallDir%bin\Hostx64\x64\cl.exe" : ^<setup^>"%VCINSTALLDIR%Auxiliary\Build\vcvarsall.bat" ;)>project-config.jam
          b2 -q -j%NUMBER_OF_PROCESSORS% toolset=msvc-14.5 --with-filesystem --with-system link=static runtime-link=shared variant=release threading=multi address-model=64 stage

      - name: Save Boost cache
        if: matrix.variant == 'cuda-opencl' && steps.cache-boost.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: boost_1_85_0
          key: boost-1.85.0-b2-msvc145-static-md-v5
        continue-on-error: true

      - name: Build CLI
        shell: bash
        run: |
          BOOST_ARGS=()
          if [ "${{ matrix.variant }}" = "cuda-opencl" ]; then
            BOOST_ARGS=(-DUSE_GPU=ON
              -DBOOST_ROOT="$GITHUB_WORKSPACE/boost_1_85_0"
              -DBoost_DIR="$GITHUB_WORKSPACE/boost_1_85_0/stage/lib/cmake/Boost-1.85.0"
              -DOpenCL_INCLUDE_DIR="$CUDA_PATH/include"
              -DOpenCL_LIBRARY="$CUDA_PATH/lib/x64/OpenCL.lib")
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="${CUDAARCHS}" \
            -DCMAKE_CUDA_COMPILER="$CUDA_PATH/bin/nvcc.exe" \
            "${BOOST_ARGS[@]}"
          cmake --build build -j
          # stash binaries immediately: build-python.sh later runs
          # "rm -rf ./lightgbm" which (via Git Bash) also deletes lightgbm.exe
          mkdir -p release_assets
          if [ "${{ matrix.variant }}" = "cuda-opencl" ]; then
            cp lightgbm.exe release_assets/all-lightgbm.exe
            cp lib_lightgbm.dll release_assets/all-lib_lightgbm.dll
          else
            cp lightgbm.exe lib_lightgbm.dll release_assets/
          fi
          ls -la release_assets

      - name: Build Python wheel
        shell: bash
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          export CUDACXX="$CUDA_PATH/bin/nvcc.exe"
          python -m pip install --upgrade pip build scikit-build-core ninja
          WHEEL_ARGS=()
          if [ "${{ matrix.variant }}" = "cuda-opencl" ]; then
            WHEEL_ARGS=(--gpu
              "--boost-root=$GITHUB_WORKSPACE/boost_1_85_0"
              "--boost-dir=$GITHUB_WORKSPACE/boost_1_85_0/stage/lib/cmake/Boost-1.85.0"
              "--opencl-include-dir=$CUDA_PATH/include"
              "--opencl-library=$CUDA_PATH/lib/x64/OpenCL.lib")
          fi
          sh build-python.sh bdist_wheel --cuda "${WHEEL_ARGS[@]}" --no-isolation
          ls dist/
          if [ "${{ matrix.variant }}" = "cuda-opencl" ]; then
            # local version segment so both variants can coexist on PyPI-less installs
            orig=$(ls dist/lightgbm-*.whl); ver=$(basename "$orig" .whl | cut -d- -f2)
            mv "$orig" "dist/lightgbm-${ver}+all-py3-none-win_amd64.whl"
          fi
          # wheels must land in release_assets or the release job never sees them
          cp dist/*.whl release_assets/

      - name: Smoke test wheel
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python -m pip install dist/lightgbm*.whl
          python - <<'PY'
          import os
          import numpy as np
          import lightgbm as lgb
          print("lightgbm", lgb.__version__)
          # GPU learners must NOT be executed here: this runner has no GPU and
          # CUDA init fatals process-wide (exit 127, not catchable from Python).
          # Instead verify the learners are COMPILED IN via binary strings —
          # the "was not enabled" stub text only exists in binaries built
          # without the respective learner.
          dll = open(lgb.basic._LIB._name, "rb").read()
          assert b"CUDA Tree Learner was not enabled" not in dll, "CUDA learner missing"
          has_opencl = os.environ["VARIANT"] == "cuda-opencl"
          if has_opencl:
              assert b"GPU Tree Learner was not enabled" not in dll, "OpenCL learner missing"
          rng = np.random.RandomState(0)
          X = rng.randn(2000, 10).astype(np.float32)
          y = (X[:, 0] > 0).astype(np.int32)
          bst = lgb.train({"objective": "binary", "num_leaves": 15, "verbose": -1},
                          lgb.Dataset(X, label=y), num_boost_round=10)
          assert bst.predict(X[:10]).shape == (10,)
          print("SMOKE_OK  (cpu trained; learners compiled in: cuda=True opencl=%s)" % has_opencl)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.variant }}
          path: release_assets/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: rel

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rel/lightgbm.exe
            rel/lib_lightgbm.dll
            rel/all-lightgbm.exe
            rel/all-lib_lightgbm.dll
            rel/*.whl
          body: |
            Prebuilt LightGBM Windows binaries. **No NCCL** — all GPU code paths are single-GPU (`num_gpu=1`).

            ## Pick your variant

            | Files | Device options | Use when |
            |---|---|---|
            | `lightgbm.exe`, `lib_lightgbm.dll`, `lightgbm-*.py3-none-win_amd64.whl` | `cpu`, `cuda` | Standard NVIDIA GPU setup (recommended) |
            | `all-lightgbm.exe`, `all-lib_lightgbm.dll`, `lightgbm-*+all-*.whl` | `cpu`, `cuda`, `gpu` (OpenCL) | Also need the OpenCL GPU version (e.g. dense data on old GPUs; sparse features are CPU-fallback there) |

            - CUDA Toolkit 13.3, GPU architectures: ${{ env.CUDAARCHS }} (Turing → Blackwell)
            - CUDA runtime statically linked — no CUDA Toolkit install needed, just a recent NVIDIA driver
            - Usage: `device = cpu` / `cuda` / `gpu` in params.
              ⚠️ switch `device` on a fresh Dataset (reusing one Dataset across CPU→CUDA raises an upstream limitation).

            Wheels carry a local version tag: `+all` marks the CPU+OpenCL+CUDA variant.

            **Full Changelog**: [${{ github.ref_name }}](https://github.com/neoblackxt/lightgbm-cuda-no-nccl-for-windows/commits/${{ github.ref_name }})
